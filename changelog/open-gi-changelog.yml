scheme: dated-release-trains
note: >-
  Open GI publishes public, dated release notes for both of its product
  trains — the cloud Mobius platform and the legacy Core policy
  administration system (Core 18, Core 19). There is no semantic version
  number and no machine-readable feed; releases land on a roughly quarterly
  cadence (February / April / July / September-October in 2025). The
  release notes are the ONLY public surface on which Open GI documents
  actual API behaviour, which is why they are captured here in structure.
  Mobius also ships in-app release notes inside the Configuration Hub for
  logged-in customers.
