actions:
  openapiDirCreated: false
  apisYmlCreated: true
  status: built-stub
  reason: |
    Real API capability exists but is entirely customer-gated. No public
    self-serve developer portal, no reachable specification, no documented
    auth model. One apis[] entry is recorded for the Mobius APIs, anchored
    to the only public page that evidences them (the Mobius release notes),
    with the gating stated explicitly. Nothing was invented: no base URL,
    no endpoints beyond those Open GI itself published, no scopes, no
    OpenAPI file.
