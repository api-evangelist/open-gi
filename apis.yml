name: Open GI
kind: company
description: Open GI is a Worcester-headquartered insurance software house that has
  supplied the UK and Ireland general insurance market for more than 45 years, serving
  over 600 broker, MGA and insurer customers across personal and commercial lines.
  Its product estate spans the legacy Core policy administration system and the newer
  cloud Mobius platform — policy administration and client management, product management,
  Insurer Hosted Pricing (IHP and IHP+), Ratings, the Dynamic Pricing Tool, quote-and-buy
  websites, customer portals and a Partner Network of 150-plus insurers, aggregators,
  premium finance, payment and data-enrichment providers. Its API posture is honestly
  partner-gated. Mobius genuinely ships APIs — Open GI's own public release notes
  describe Client Checks / sanctions-check endpoints and an API-triggered custom-event
  call — but the Mobius Developer Portal is a customer-only surface whose URL Open
  GI does not publish, no developer, docs, api or partners subdomain resolves on opengi.co.uk,
  every /developers, /developer, /api and /partners path on the marketing site returns
  404, and even the company's own API Terms of Use page is password-protected. There
  is no public self-serve developer portal, no downloadable OpenAPI or Swagger, no
  public sandbox, no published auth model and no ACORD reference anywhere on the public
  site; insurer connectivity is delivered through UK-market EDI messaging inside the
  platform and through pre-agreed Partner Network integrations rather than through
  an open API programme.
