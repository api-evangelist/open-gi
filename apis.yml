apis:
- aid: open-gi:mobius-apis
  name: Mobius APIs
  description: >-
    The API layer of Open GI's cloud Mobius broking platform. Open GI's public
    Mobius release notes document real API capability — a Client Checks API
    whose sanctions-check endpoints include a POST to initiate a sanction check
    for a customer, GET endpoints for automated and manual sanction-check
    matches, a GET for the detail of a specific sanction and a POST to update
    notes and overridden matches, plus the ability to trigger a Mobius custom
    event from an external system via an API call. Access is gated. Open GI
    states these APIs are consumed through the Mobius Developer Portal by
    existing "Mobius APIs users", the portal URL is not published anywhere
    public, no developer or docs host resolves under opengi.co.uk, and the
    company's API Terms of Use page is password-protected. No base URL,
    OpenAPI definition, authentication scheme, rate limits or sandbox are
    publicly documented, so none are recorded here.
  humanURL: https://www.opengi.co.uk/mobius-release
